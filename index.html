<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Marek Šípek is a software engineer focused on full-stack development, backend systems, Azure, and AI-powered automation."
    />
    <meta name="author" content="Marek Šípek" />
    <meta name="theme-color" content="#07090f" />
    <meta property="og:title" content="Marek Šípek — Software Engineer" />
    <meta
      property="og:description"
      content="Full-stack applications, backend systems, real-time software, and AI-powered automation."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const theme =
          savedTheme === "dark" || savedTheme === "light"
            ? savedTheme
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";

        const savedLanguage = localStorage.getItem("portfolio-language");
        const language =
          savedLanguage === "en" || savedLanguage === "cs"
            ? savedLanguage
            : navigator.language.toLowerCase().startsWith("cs")
              ? "cs"
              : "en";

        document.documentElement.dataset.theme = theme;
        document.documentElement.lang = language;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>Marek Šípek — Software Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
